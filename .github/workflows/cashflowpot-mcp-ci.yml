name: Quollnet MCP CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/dedicated-cashflowpot-mcp
      - feature/qledger-mcp
      - experiment/qledger-oauth-reauth-challenge
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          QAUTH_APP_ID: test-app-id
          QAUTH_PUBLIC_KEY: test-public-key
          QAPP_APP_ID: qapp-test-app
          CASHFLOWPOT_APP_ID: cashflowpot-test-app
        run: python -m unittest discover -s tests -v
